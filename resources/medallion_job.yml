resources:
  jobs:
    medallion_pipeline:
      name: medallion-pipeline-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: bronze
          spark_python_task:
            python_file: ../src/medallion/jobs.py
            parameters: ["--layer", "bronze", "--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: default

        - task_key: silver
          depends_on:
            - task_key: bronze
          spark_python_task:
            python_file: ../src/medallion/jobs.py
            parameters: ["--layer", "silver", "--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: default

        - task_key: gold
          depends_on:
            - task_key: silver
          spark_python_task:
            python_file: ../src/medallion/jobs.py
            parameters: ["--layer", "gold", "--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
