[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-medallion-pipeline"
version = "0.1.0"
description = "Medallion (bronze/silver/gold) pipeline on Databricks with Delta Lake, quality quarantine and Asset Bundles"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pyspark>=3.5,<4.1", "pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
